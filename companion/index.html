<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KH1 Companion</title>
<style>
  :root {
    --bg: #0b1024;
    --panel: #141b3a;
    --panel-2: #1c2550;
    --line: #2a3566;
    --text: #e8ecff;
    --muted: #8c96c4;
    --gold: #f2c14e;
    --good: #5fd39a;
    --warn: #ff8a65;
    --here: #3b6cff;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    min-height: 48px;
  }
  .where { flex: 1; min-width: 0; }
  .where .world { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where .room { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvl { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.live { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.stale { background: var(--gold); }

  main { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.on { display: block; }

  nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); }
  nav button {
    flex: 1; min-height: 52px; background: none; border: 0; color: var(--muted);
    font: inherit; font-weight: 600; font-size: 14px;
  }
  nav button.on { color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .bar.done > i { background: var(--good); }

  button.chip {
    min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600;
  }
  button.chip.on { border-color: var(--gold); color: var(--gold); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); min-height: 44px;
  }
  ul.list li:last-child { border-bottom: 0; }
  .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  li.got .tick { background: var(--good); border-color: var(--good); }
  li.got .name { color: var(--muted); text-decoration: line-through; }
  li.here { background: color-mix(in srgb, var(--here) 18%, transparent); border-radius: 8px; }
  .tag { font-size: 11px; font-weight: 700; color: var(--here); text-transform: uppercase; flex: none; }
  .sub { color: var(--muted); font-size: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .grid button {
    text-align: left; padding: 10px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; min-height: 64px;
  }
  .grid button.cur { border-color: var(--here); }
  .grid .wn { font-weight: 600; font-size: 14px; }
  .grid .wc { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; }
  .sheet-bg.on { display: flex; }
  .sheet {
    width: 100%; max-height: 85%; overflow-y: auto; background: var(--panel);
    border-radius: 16px 16px 0 0; padding: 14px; border-top: 1px solid var(--line);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 16px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .tag.pup { color: var(--gold); }

  .mapcard { padding: 6px; }
  svg.map { width: 100%; height: auto; max-height: calc(100vh - 222px); display: block; }
  svg.map .edge { stroke: var(--line); stroke-width: 3; }
  svg.map .edge.approx { stroke-dasharray: 6 5; }
  svg.map .node rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 2; }
  svg.map .node.bare rect { fill: var(--bg); }
  svg.map .node.done rect { stroke: var(--good); }
  svg.map .node.here rect { stroke: var(--here); stroke-width: 4; fill: color-mix(in srgb, var(--here) 30%, var(--panel-2)); }
  svg.map .nl { fill: var(--text); font-size: 13px; font-weight: 600; text-anchor: middle; }
  svg.map .node.bare .nl { fill: var(--muted); font-weight: 500; }
  svg.map .nc { fill: var(--gold); font-size: 11px; text-anchor: middle; font-weight: 700; }
  svg.map .node.done .nc { fill: var(--good); }
  svg.map .save { fill: var(--good); }
  svg.map .pup { fill: var(--gold); }
  svg.map .node { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .lg.here { border: 3px solid var(--here); }
  .lg.save { border-radius: 50%; background: var(--good); width: 8px; height: 8px; }
  .lg.pup { border-radius: 50%; background: var(--gold); width: 10px; height: 10px; }
  .lg.dash { width: 18px; height: 0; border-top: 3px dashed var(--line); border-radius: 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="Connection"></span>
  <div class="where">
    <div class="world" id="hWorld">Waiting for game…</div>
    <div class="room" id="hRoom">Start KH1 with the companion script installed</div>
  </div>
  <span class="lvl" id="hLevel"></span>
</header>

<main>
  <section class="view on" id="v-here"></section>
  <section class="view" id="v-map"></section>
  <section class="view" id="v-worlds"></section>
  <section class="view" id="v-collect"></section>
</main>

<nav>
  <button class="on" data-view="here">Here</button>
  <button data-view="map">Map</button>
  <button data-view="worlds">Worlds</button>
  <button data-view="collect">Collect</button>
</nav>

<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetBody"></div></div>

<script src="data.js"></script>
<script src="maps.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
