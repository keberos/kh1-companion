<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KH1 Companion</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<!-- Icon sprite and shared SVG paint servers (original art). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22397f"/><stop offset="1" stop-color="#0b1440"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2bf"/><stop offset=".5" stop-color="#f2c75a"/><stop offset="1" stop-color="#a87517"/>
    </linearGradient>
    <linearGradient id="woodFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fd6"/><stop offset="1" stop-color="#1b3488"/>
    </linearGradient>
    <radialGradient id="saveGlow">
      <stop offset="0" stop-color="#eafff3"/><stop offset=".45" stop-color="#6dffb0"/><stop offset="1" stop-color="#6dffb0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- treasure chest, closed -->
    <symbol id="ico-chest" viewBox="0 0 32 32">
      <path d="M5 13 Q5 6 16 6 Q27 6 27 13 Z" fill="url(#woodFill)" stroke="url(#goldFill)" stroke-width="1.6"/>
      <rect x="5" y="13" width="22" height="13" rx="1.5" fill="url(#woodFill)" stroke="url(#goldFill)" stroke-width="1.6"/>
      <path d="M10 6.8 V26 M22 6.8 V26" stroke="url(#goldFill)" stroke-width="2"/>
      <rect x="13.5" y="11" width="5" height="6" rx="1" fill="url(#goldFill)"/>
      <circle cx="16" cy="14.2" r="1" fill="#1b2a66"/>
    </symbol>
    <!-- treasure chest, opened -->
    <symbol id="ico-chest-open" viewBox="0 0 32 32">
      <path d="M6 13 L9 4 Q16 2 23 4 L26 13 Z" fill="#162a6a" stroke="#8d7a46" stroke-width="1.4"/>
      <rect x="5" y="13" width="22" height="13" rx="1.5" fill="#132560" stroke="#8d7a46" stroke-width="1.4"/>
      <path d="M10 13 V26 M22 13 V26" stroke="#8d7a46" stroke-width="1.8"/>
      <ellipse cx="16" cy="13.5" rx="9" ry="1.6" fill="#f6d77a" opacity=".35"/>
    </symbol>
    <!-- save point -->
    <symbol id="ico-save" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15" fill="url(#saveGlow)"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#c9ffe0" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="none" stroke="#6dffb0" stroke-width="1.2" stroke-dasharray="2 2"/>
    </symbol>
    <!-- Ansem's Report page: found / missing -->
    <symbol id="ico-report" viewBox="0 0 32 32">
      <path d="M8 4 H20 L25 9 V28 H8 Z" fill="#efe3c0" stroke="url(#goldFill)" stroke-width="1.4"/>
      <path d="M20 4 V9 H25" fill="#d6c79c" stroke="url(#goldFill)" stroke-width="1.2"/>
      <path d="M11 13 H22 M11 17 H22 M11 21 H19" stroke="#8a6d3a" stroke-width="1.3"/>
    </symbol>
    <symbol id="ico-report-missing" viewBox="0 0 32 32">
      <path d="M8 4 H20 L25 9 V28 H8 Z" fill="none" stroke="#5d6c98" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text x="16.5" y="22" font-size="12" text-anchor="middle" fill="#5d6c98" font-family="Cinzel, serif" font-weight="700">?</text>
    </symbol>
    <!-- map pin -->
    <symbol id="ico-pin" viewBox="0 0 32 32">
      <path d="M16 3a9 9 0 0 0-9 9c0 7 9 17 9 17s9-10 9-17a9 9 0 0 0-9-9z" fill="url(#goldFill)"/>
      <circle cx="16" cy="12" r="3.5" fill="#1b2a66"/>
    </symbol>
    <!-- paw print -->
    <symbol id="ico-paw" viewBox="0 0 32 32">
      <g fill="#f6d77a">
        <ellipse cx="16" cy="21" rx="7" ry="6"/>
        <ellipse cx="7.5" cy="13" rx="3" ry="3.8"/><ellipse cx="13" cy="8.5" rx="3" ry="3.8"/>
        <ellipse cx="19" cy="8.5" rx="3" ry="3.8"/><ellipse cx="24.5" cy="13" rx="3" ry="3.8"/>
      </g>
    </symbol>
  </defs>
</svg>

<header>
  <span class="dot" id="dot" title="Connection"></span>
  <div class="where">
    <div class="world" id="hWorld">Waiting for game…</div>
    <div class="room" id="hRoom">Start KH1 with the companion script installed</div>
  </div>
  <span class="lvl" id="hLevel"></span>
  <button class="xbtn" id="closeBtn" hidden aria-label="Close companion">&times;</button>
</header>
<div class="sheet" id="closeSheet" hidden>
  <div class="card">
    <div class="sheet-title">Close the companion?</div>
    <p>Open it again from the KH1 Companion app icon.</p>
    <div class="sheet-row">
      <button class="btn" id="closeNo">Keep it</button>
      <button class="btn" id="closeSettings">Settings</button>
      <button class="btn primary" id="closeYes">Close</button>
    </div>
  </div>
</div>

<main>
  <section class="view on" id="v-here"></section>
  <section class="view" id="v-guide"></section>
  <section class="view" id="v-map"></section>
  <section class="view" id="v-worlds"></section>
  <section class="view" id="v-collect"></section>
</main>

<nav>
  <button class="on" data-view="here">Here</button>
  <button data-view="guide">Guide</button>
  <button data-view="map">Map</button>
  <button data-view="worlds">Worlds</button>
  <button data-view="collect">Collect</button>
</nav>

<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetBody"></div></div>

<script src="data.js"></script>
<script src="maps.js"></script>
<script src="guide.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
