<style>

  .dpad i:nth-child(1) { left: 25px; top: 0; width: 24px; height: 74px; }

  .stick.l { left: 44px; top: 150px; } .stick.r { right: 44px; top: 150px; }

  .abxy b:nth-child(1) { left: 28px; top: 0; } .abxy b:nth-child(2) { left: 56px; top: 28px; }

  .grille { position: absolute; top: 262px; width: 70px; height: 34px;

  .grille.l { left: 46px; } .grille.r { right: 46px; }
</style>
